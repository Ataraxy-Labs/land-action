# land for GitLab CI: run only the tests a change can reach, on GitLab's own hosted runners, with no account.
#
# In your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/Ataraxy-Labs/land-action/v1/gitlab/land.gitlab-ci.yml
#
#   land:
#     extends: .land
#     image: python:3.12            # any Debian or Ubuntu image with your toolchain and python3
#     before_script:
#       - pip install -r requirements-dev.txt
#     variables:
#       LAND_RUN: |
#         core: python -m pytest -q tests/core
#         api: python -m pytest -q tests/api
#
# A command is carried (not run) when every file it read on the default branch's last green pipeline is unchanged.
# The record is kept in GitLab's cache and written only by green pipelines on the default branch.

.land:
  # land's recorder uses eBPF, which needs a privileged job: GitLab.com's hosted Linux runners are privileged
  tags: [saas-linux-small-amd64]
  variables:
    LAND_VERSION: v1
    GIT_DEPTH: "0"
  cache:
    key: land-record-$CI_DEFAULT_BRANCH
    paths: [.land-cache/]
    policy: pull-push
    when: on_success
  script:
    - command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git >/dev/null)
    - mkdir -p /usr/local/lib/land
    - for f in land.py bin/inspect; do python3 -c "import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "https://raw.githubusercontent.com/Ataraxy-Labs/land-action/$LAND_VERSION/$f" "/usr/local/lib/land/$(basename $f)"; done
    - export RUN_LINES="$LAND_RUN" WD="${LAND_WORKING_DIRECTORY:-.}" LAND_BIN=/usr/local/lib/land/inspect RUNNER_TEMP=/tmp
    - python3 /usr/local/lib/land/land.py prepare
    - python3 /usr/local/lib/land/land.py check
  artifacts:
    when: always
    paths: [land-summary.md]
    expire_in: 30 days
